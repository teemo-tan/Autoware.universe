name: Mirror Autoware Image to Aliyun

on:
  workflow_dispatch: # 手动触发

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-d3y3qro9com2p9eo.cn-hangzhou.personal.cr.aliyuncs.com # 根据你的实际区域修改，如 cn-beijing
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull, Tag and Push
        run: |
          SOURCE_IMAGE="ghcr.io/autowarefoundation/autoware-universe:universe-visualization-devel-20251226"
          TARGET_IMAGE="crpi-d3y3qro9com2p9eo.cn-hangzhou.personal.cr.aliyuncs.com/my-autoware-jocker/universe:20251226-viz"
          
          echo "Checking Docker version..."
          docker version
          
          echo "Step 1: Pulling from GitHub (GHCR)..."
          if ! docker pull $SOURCE_IMAGE; then
            echo "Error: Failed to pull image from GHCR"
            exit 1
          fi
          
          echo "Step 2: Tagging image..."
          docker tag $SOURCE_IMAGE $TARGET_IMAGE
          
          echo "Step 3: Pushing to Aliyun..."
          if ! docker push $TARGET_IMAGE; then
            echo "Error: Failed to push image to Aliyun. Check if the repository 'universe' exists in namespace 'my-autoware-jocker'."
            exit 1
          fi
          echo "Successfully mirrored!"
