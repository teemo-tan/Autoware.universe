name: Mirror Autoware Image to Aliyun

on:
  workflow_dispatch: 

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-d3y3qro9com2p9eo.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Pull, Tag and Push
        run: |
          # 尝试使用官方最常用的两个标签之一：
          # 方案 A: latest-cuda (最新版)
          # 方案 B: 如果你非要 20251226，尝试 universe-devel-cuda-20251226 (去掉 visualization)
          
          SOURCE_IMAGE="ghcr.io/autowarefoundation/autoware-universe:latest-cuda"
          TARGET_IMAGE="crpi-d3y3qro9com2p9eo.cn-hangzhou.personal.cr.aliyuncs.com/my-autoware-jocker/universe:latest-cuda"
          
          echo "Pulling $SOURCE_IMAGE..."
          docker pull $SOURCE_IMAGE
          
          docker tag $SOURCE_IMAGE $TARGET_IMAGE
          
          echo "Pushing to Aliyun..."
          docker push $TARGET_IMAGE
