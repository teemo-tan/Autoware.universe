name: Mirror Autoware Image to Aliyun

on:
  workflow_dispatch: 

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 不需要 permissions 了，因为我们要匿名拉取
    
    steps:
      # 1. 只登录阿里云 (目标仓库)
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-d3y3qro9com2p9eo.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 2. 清理空间 (必做)
      - name: Free Disk Space
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      # 3. 拉取、打标、推送
      - name: Pull, Tag and Push
        run: |
          # 修改源镜像为目前最稳健的 Humble 版本
          # 如果这个能成功，说明链路通了，之后你再换成具体的日期版本
          SOURCE_IMAGE="ghcr.io/autowarefoundation/autoware-universe:humble-latest-cuda"
          TARGET_IMAGE="crpi-d3y3qro9com2p9eo.cn-hangzhou.personal.cr.aliyuncs.com/my-autoware-jocker/universe:humble-latest-cuda"
          
          echo "Step 1: Pulling from GHCR (Anonymous)..."
          # 直接拉取，不登录 ghcr
          docker pull $SOURCE_IMAGE
          
          echo "Step 2: Tagging..."
          docker tag $SOURCE_IMAGE $TARGET_IMAGE
          
          echo "Step 3: Pushing to Aliyun..."
          # 增加重试逻辑
          for i in {1..5}; do
            docker push $TARGET_IMAGE && echo "Success!" && break || (echo "Retry $i..." && sleep 10)
          done
